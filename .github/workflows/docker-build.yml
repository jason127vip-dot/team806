name: Docker Build CI

on:
  push:
    branches:
      - JIN
  pull_request:
    branches:
      - main

env:
  BACKEND_IMAGE: team806-backend
  FRONTEND_IMAGE: team806-frontend

jobs:
  docker-build:
    name: Build backend and frontend Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Django backend image
        run: docker build -t $BACKEND_IMAGE:ci ./backend

      - name: Build React frontend image
        run: docker build -t $FRONTEND_IMAGE:ci ./frontend
